# Production stack (Coolify). The database is a separate resource in Coolify's network
# "coolify", reached via DATABASE_URL. compose.override.yaml adds a local database,
# replaces that network and publishes the ports.

x-logging: &logging
  driver: ${LOG_DRIVER:-journald}

x-backend: &backend
  build: .
  restart: unless-stopped
  logging: *logging
  # ${VAR:?} is required, ${VAR:-value} has a default
  environment:
    SECRET_KEY: ${SECRET_KEY:?}
    JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?}
    DEBUG: ${DEBUG:-False}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
    FRONTEND_URL: ${FRONTEND_URL:?}
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-True}
    AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
    AUTH_COOKIE_REFRESH_PATH: ${AUTH_COOKIE_REFRESH_PATH:-/auth/}
    AUTH_COOKIE_PREFIX: ${AUTH_COOKIE_PREFIX:-}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
    SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
    SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
    EMAIL_URL: ${EMAIL_URL:?}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
    SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@nibble-tracking.de}
    DELETION_LOG_RECIPIENTS: ${DELETION_LOG_RECIPIENTS:-}
    OFF_API_URL: ${OFF_API_URL:-https://world.openfoodfacts.org}
    OFF_API_BASIC_AUTH: ${OFF_API_BASIC_AUTH:-}
    OFF_USER_ID: ${OFF_USER_ID:-}
    OFF_PASSWORD: ${OFF_PASSWORD:-}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
    CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
    NUM_PROXIES: ${NUM_PROXIES:-0}
    DATABASE_URL: ${DATABASE_URL:?}
    REDIS_URL: redis://nibble-redis:6379/0
    CELERY_BROKER_URL: redis://nibble-redis:6379/1
  volumes:
    - media_data:/app/media
  networks:
    - default
    - coolify
  depends_on:
    nibble-redis:
      condition: service_healthy

services:
  # Not just "redis": Coolify's own Redis has that name in the network "coolify"
  nibble-redis:
    image: redis:8
    restart: unless-stopped
    logging: *logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    <<: *backend
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

volumes:
  redis_data:
  media_data:
  static_data:

networks:
  coolify:
    external: true
