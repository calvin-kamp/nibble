services:
  db:
    image: postgres:17
    container_name: nibble-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nibble
      POSTGRES_USER: nibble
      POSTGRES_PASSWORD: nibble_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nibble -d nibble"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: